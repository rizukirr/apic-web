name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Copy apic-gui MSIs from releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags=$(gh release list -R rizukirr/apic -L 1000 --json tagName -q '.[].tagName')
          for tag in $tags; do
            assets=$(gh release view "$tag" -R rizukirr/apic --json assets -q '.assets[].name')
            grep -q '^apic-gui-.*\.msi$' <<< "$assets" || continue
            gh release download "$tag" -R rizukirr/apic -p 'apic-gui-*.msi' -D "build/downloads/${tag#v}"
          done
          ls build/downloads/*/apic-gui-*.msi > /dev/null
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
